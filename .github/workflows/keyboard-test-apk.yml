name: Keyboard test APK (PR 263)

on:
  push:
    branches: [test/pr-263-keyboard-apk]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          if [ ! -d "$ANDROID_HOME/ndk/$ndk" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"
          fi
      - name: Build Linux runtime
        run: scripts/fetch-proot.sh
      - name: Unit tests
        run: ./gradlew :owl:test :app:testDebugUnitTest
      - name: Build and lint APK
        run: ./gradlew :app:assembleDebug :app:lintDebug
      - name: Package APK and checksum
        run: |
          mkdir -p test-apk
          cp app/build/outputs/apk/debug/app-debug.apk test-apk/omalauncher-pr263-keyboard-test.apk
          cd test-apk
          sha256sum omalauncher-pr263-keyboard-test.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: omalauncher-pr263-keyboard-test
          path: test-apk/
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-test-reports
          path: |
            app/build/reports/
            owl/build/reports/
          if-no-files-found: ignore
          retention-days: 14
