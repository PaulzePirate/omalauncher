name: Keyboard test APK (PR 263)

on:
  push:
    branches: [test/pr-263-keyboard-apk]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          if [ ! -d "$ANDROID_HOME/ndk/$ndk" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"
          fi
      - name: Build Linux runtime
        run: scripts/fetch-proot.sh
      - name: Unit tests
        run: ./gradlew :owl:test :app:testDebugUnitTest
      - name: Build and lint APK
        run: ./gradlew :app:assembleDebug :app:lintDebug
      - name: Package APK and checksum
        run: |
          mkdir -p test-apk
          cp app/build/outputs/apk/debug/app-debug.apk test-apk/omalauncher-pr263-keyboard-test.apk
          cd test-apk
          sha256sum omalauncher-pr263-keyboard-test.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: omalauncher-pr263-keyboard-test
          path: test-apk/
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
            owl/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Allow emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build emulator test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PkeyboardTestAbi=x86_64
      - name: Exercise the actual launcher and soft keyboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb logcat -c
            ./gradlew :app:connectedDebugAndroidTest -PkeyboardTestAbi=x86_64
      - name: Capture device evidence
        if: always()
        run: |
          adb logcat -d > keyboard-logcat.txt || true
          adb exec-out screencap -p > keyboard-screen.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyboard-device-regression
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            keyboard-logcat.txt
            keyboard-screen.png
